{% extends "base.html" %}

{% block title %}{{ t.login }} | {{ t.app_name }}{% endblock %}

{% block content %}
<div class="auth-page-container">
    <div class="auth-card">
        <!-- Auth Header -->
        <div class="auth-header">
            <div class="auth-icon-badge">
                <i class="fa-solid fa-arrow-right-to-bracket"></i>
            </div>
            <h1 class="auth-title">{{ t.login }}</h1>
            <p class="auth-subtitle">{{ t.subtitle }}</p>
        </div>

        <!-- Login Form -->
        <form action="{{ url_for('auth.login', next=request.args.get('next', '')) }}" method="POST" class="auth-form" id="login-form">
            <div class="form-group">
                <label for="login_identifier" class="form-label">
                    <i class="fa-solid fa-user"></i> {{ t.username }} / {{ t.email }}
                </label>
                <div class="input-with-icon">
                    <input 
                        type="text" 
                        id="login_identifier" 
                        name="login_identifier" 
                        class="form-input" 
                        value="{{ identifier or '' }}" 
                        placeholder="{{ t.username }} or email@example.com" 
                        required 
                        autofocus
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">
                    <i class="fa-solid fa-lock"></i> {{ t.password }}
                </label>
                <div class="input-with-icon password-toggle-wrapper">
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="form-input" 
                        placeholder="••••••••" 
                        required
                    >
                    <button type="button" class="btn-toggle-password" id="toggle-password-btn" aria-label="Toggle password visibility">
                        <i class="fa-solid fa-eye" id="password-eye-icon"></i>
                    </button>
                </div>
            </div>

            <div class="form-options-row">
                <label class="remember-checkbox-label">
                    <input type="checkbox" name="remember" value="1" checked class="form-checkbox">
                    <span>{{ t.remember_me }}</span>
                </label>
            </div>

            <button type="submit" class="auth-submit-btn" id="login-submit-btn">
                <i class="fa-solid fa-right-to-bracket"></i>
                <span>{{ t.login_btn }}</span>
            </button>
        </form>

        <!-- Auth Footer -->
        <div class="auth-card-footer">
            <p>{{ t.no_account }} <a href="{{ url_for('auth.register') }}" class="auth-link-highlight">{{ t.register }}</a></p>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const toggleBtn = document.getElementById('toggle-password-btn');
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('password-eye-icon');

    if (toggleBtn && passwordInput && eyeIcon) {
        toggleBtn.addEventListener('click', function() {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.className = 'fa-solid fa-eye-slash';
            } else {
                passwordInput.type = 'password';
                eyeIcon.className = 'fa-solid fa-eye';
            }
        });
    }
});
</script>
{% endblock %}
